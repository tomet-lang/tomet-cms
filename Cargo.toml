[workspace]
resolver = "3"
members = ["crates/core"]

default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tomet = { git = "https://github.com/tomet-lang/tomet.git", default-features = false, features = ["parser", "printer", "merge"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
